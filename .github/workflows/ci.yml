name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Route types are generated from the app directory and are needed by
      # tsc; without this step `PageProps<'/runs'>` does not resolve in CI.
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # No secrets are provided. The build must succeed without an API key or a
      # database, which is also how a reviewer will first run it.
      # Uses the standard Next.js build (not the Cloudflare worker bundle) so
      # that the CI step has no native-addon or workerd dependencies.
      - name: Build
        run: pnpm run build:next
